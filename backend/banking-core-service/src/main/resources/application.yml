# Configuration shared by every environment.
# Environment-specific values (URLs, credentials) have NO default here: they come from environment
# variables (Kubernetes, Vault...). On a developer machine, run with the "local" profile, which
# provides them from application-local.yml. A missing value makes the service fail at startup
# instead of silently falling back to localhost or a dev password.
server:
  port: 8081
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: banking-core-service
  datasource:
    url: ${CORE_DB_URL}
    username: ${CORE_DB_USER}
    password: ${CORE_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: core-service-ledger
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    producer:
      acks: all
    listener:
      ack-mode: record
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          audiences: banking-backend

# API documentation is not exposed outside local development.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
