# Configuration shared by every environment. Environment-specific values have no default:
# they come from environment variables, or from application-local.yml with the "local" profile.
server:
  port: 8083
  error:
    include-stacktrace: never

spring:
  application:
    name: banking-workflow-camunda
  datasource:
    url: ${CAMUNDA_DB_URL}
    username: ${CAMUNDA_DB_USER}
    password: ${CAMUNDA_DB_PASSWORD}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          audiences: banking-backend

camunda:
  bpm:
    database:
      # Outside local development the engine schema is created and migrated with Camunda's SQL
      # scripts under change control, never by the application at startup.
      schema-update: false
    job-execution:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
