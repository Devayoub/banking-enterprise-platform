# Configuration shared by every environment. Environment-specific values have no default:
# they come from environment variables, or from application-local.yml with the "local" profile.
server:
  port: 8080

spring:
  application:
    name: banking-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}
          audiences: banking-backend
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE
          routes:
            - id: core-service
              uri: ${banking.services.core-url}
              predicates:
                - Path=/api/v1/accounts/**,/api/v1/me
            - id: workflow-service
              uri: ${banking.services.workflow-url}
              predicates:
                - Path=/api/v1/loans/**

banking:
  services:
    core-url: ${CORE_SERVICE_URL}
    workflow-url: ${WORKFLOW_SERVICE_URL}
  cors:
    allowed-origins: ${FRONTEND_ORIGIN}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
