server:
  port: 8082

spring:
  application:
    name: banking-integration-camel
  # JMS provider for the legacy core. ActiveMQ Classic locally; IBM MQ in bank environments.
  activemq:
    broker-url: ${MQ_BROKER_URL:tcp://localhost:61616}
    user: ${MQ_USER:banking}
    password: ${MQ_PASSWORD:banking}

camel:
  component:
    kafka:
      brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      request-required-acks: all
      enable-idempotence: true

banking:
  integration:
    inbound-queue: CORE.BANKING.TRANSACTIONS.OUT
    dead-letter-queue: CORE.BANKING.TRANSACTIONS.DLQ
    transaction-topic: account-transactions-events
    source-system: LEGACY_CORE

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
